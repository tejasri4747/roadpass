name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - 'tejasri4747-fix-open-issue'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public directory
        run: |
          mkdir -p public
          cp -v index.html style.css script.js README.md public/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
