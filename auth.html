<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadPass — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <span class="brand-mark">RP</span>
        <span class="brand-name">RoadPass</span>
      </div>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Welcome to RoadPass</h1>
        <p>Rent vehicles with ease</p>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form active">
          <label>
            Email
            <input type="email" id="login-email" required placeholder="your@email.com">
          </label>
          <label>
            Password
            <input type="password" id="login-password" required placeholder="••••••••">
          </label>
          <button type="submit" class="btn btn-amber full">Login</button>
          <p class="auth-hint">Demo: any email + password "123"</p>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signup-form" class="auth-form">
          <label>
            Full Name
            <input type="text" id="signup-name" required placeholder="Your Name">
          </label>
          <label>
            Email
            <input type="email" id="signup-email" required placeholder="your@email.com">
          </label>
          <label>
            Phone
            <input type="tel" id="signup-phone" required placeholder="10-digit number" pattern="[0-9]{10}">
          </label>
          <label>
            Password
            <input type="password" id="signup-password" required placeholder="••••••••">
          </label>
          <label>
            Confirm Password
            <input type="password" id="signup-confirm" required placeholder="••••••••">
          </label>
          <button type="submit" class="btn btn-amber full">Create Account</button>
        </form>
      </div>
    </div>
  </section>

  <script src="auth.js"></script>
</body>
</html>
